<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-container">

    <section class="login-box">
      <img src="img/LOGO-NEX.png.png" alt="Logo NexFinance" class="logo">

      <h1>Bem-vindo de volta!</h1>
      <p>Acesse sua conta e continue gerenciando seu negócio com inteligência.</p>

      <form action="/login" method="post">
        <label for="username">E-mail</label>
        <input type="email" id="username" name="username" placeholder="seu@email.com" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Sua senha" required>

        <a href="esqueci.html" class="forgot">Esqueci minha senha</a>

        <button type="submit" class="btn-primary">Entrar</button>

        <button type="button" class="btn-secondary" onclick="window.location.href='entrar.html'">
          Continuar com Google
        </button>

        <div class="register-text">
          Não tem uma conta?
          <a href="cadastro.html">Criar Conta</a>
        </div>

        <div class="terms">
          Ao criar uma conta, você concorda com nossos
          <a href="termos.html">Termos de Serviço</a> e
          <a href="privacidade.html">Política de Privacidade</a>.
        </div>
      </form>

      <a href="index.html" class="back-link">Voltar para a página inicial</a>
    </section>

    <section class="image-box">
      <img src="img/Mascote-png.png" alt="Mascote NexFinance" class="mascote">
      <div class="image-text">
      
<script src="login.js"></script>
</body>
</html>
