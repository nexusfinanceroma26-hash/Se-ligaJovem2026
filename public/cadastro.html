<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NexFinance">
  <title>Criar Conta | NexFinance</title>
  <link rel="icon" type="image/png" href="img/LOGO-NEX.png.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/LOGO-NEX.png.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-container login-light register-page">
    <section class="login-box">
      <a class="brand" href="login.html" aria-label="NexFinance">
        <img class="brand-logo" src="img/LOGO-NEX.png.png" alt="NexFinance - Seu Sucesso, Nossa Inteligência">
      </a>

      <span class="login-eyebrow">Nova empresa</span>
      <h1>Crie sua conta</h1>
      <p>Organize clientes, estoque, vendas e financeiro em uma plataforma preparada para pequenos negócios.</p>

      <form id="cadastroForm">
        <label for="name">Nome completo</label>
        <input type="text" id="name" name="name" placeholder="Seu nome" autocomplete="name" required>

        <label for="company">Nome da empresa</label>
        <input type="text" id="company" name="company" placeholder="Ex: NexFinance Consultoria" autocomplete="organization" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Crie uma senha" autocomplete="new-password" minlength="6" required>

        <label for="confirmPassword">Confirmar senha</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita sua senha" autocomplete="new-password" minlength="6" required>

        <button type="submit" class="btn-primary">Criar conta</button>
        <div id="registerMessage" class="message" aria-live="polite"></div>

        <p class="signup-text">Já tem uma conta? <a href="login.html">Entrar</a></p>
      </form>

      <a href="index.html" class="back-link">Voltar para a página inicial</a>
    </section>

    <section class="mascot-panel" aria-label="Resumo NexFinance">
      <div class="mascot-card light-mascot-card">
        <div class="mascot-ring" aria-hidden="true"></div>
        <div class="finance-card finance-card-revenue">
          <span>Receita</span>
          <strong>R$ 128.540,00</strong>
          <small>▲ 18,6% vs mês anterior</small>
          <div class="sparkline sparkline-up" aria-hidden="true"></div>
        </div>

        <div class="finance-card finance-card-score">
          <span>Score Financeiro</span>
          <strong>842</strong>
          <small>Excelente</small>
        </div>

        <div class="finance-card finance-card-cash">
          <span>Fluxo de Caixa</span>
          <strong>R$ 61.310,00</strong>
          <div class="cash-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <img class="mascot-image" src="img/Mascote-png.png" alt="Nexy, mascote financeiro da NexFinance">
      </div>
    </section>
  </main>

  <script src="pwa.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
