<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha | NexFinance</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-container">
    <section class="login-box">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="img/LOGO-NEX.png.png" alt="NexFinance - Seu Sucesso, Nossa Inteligência">
      </a>

      <h1>Recuperar senha</h1>
      <p>Informe seu e-mail para gerar um link de recuperação no terminal do servidor.</p>

      <form id="recoverForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>

        <button type="submit" class="btn-primary">Enviar link</button>
        <div id="recoverMessage" class="message" aria-live="polite"></div>
      </form>

      <a href="login.html" class="back-link">Voltar para o login</a>
    </section>

    <section class="info-panel">
      <span class="badge">Segurança</span>
      <h2>Recuperação com token temporário.</h2>
      <p>O servidor gera um token de redefinição com validade curta, simulando o fluxo seguro de recuperação de senha.</p>
    </section>
  </main>

  <script src="recuperar.js"></script>
</body>
</html>
