<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | NexFinance</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-container">
    <section class="login-box">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="img/LOGO-NEX.png.png" alt="NexFinance - Seu Sucesso, Nossa Inteligência">
      </a>

      <h1>Bem-vindo de volta</h1>
      <p>Acesse sua conta e continue gerenciando seu negócio com inteligência.</p>

      <form id="loginForm">
        <label for="username">E-mail</label>
        <input type="email" id="username" name="username" placeholder="seu@email.com" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Sua senha" required>

        <a href="esqueci.html" class="forgot">Esqueci minha senha</a>

        <button type="submit" class="btn-primary">Entrar</button>
        <button type="button" class="btn-secondary" onclick="window.location.href='cadastro.html'">Criar conta</button>

        <div id="loginMessage" class="message" aria-live="polite"></div>

        <div class="terms">
          Ao acessar, você concorda com os Termos de Serviço e a Política de Privacidade da NexFinance.
        </div>
      </form>

      <a href="index.html" class="back-link">Voltar para a página inicial</a>
    </section>

    <section class="mascot-panel" aria-label="Mascote NexFinance">
      <img src="img/Mascote-png.png" alt="Nexy, mascote financeiro da NexFinance">
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
